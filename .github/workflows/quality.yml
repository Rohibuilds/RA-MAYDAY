name: Project quality checks

on:
  push:
    branches: [main, colossus-4-quality-gates]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    name: Source package and dashboard validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify embedded dashboard is synchronized
        run: python3 tools/build_dashboard.py --check

      - name: Verify package and dashboard JavaScript
        run: python3 tools/verify_package.py
