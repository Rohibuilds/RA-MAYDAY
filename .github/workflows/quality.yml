name: Project quality checks

on:
  push:
    branches: [main, colossus-4-quality-gates]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    name: Source package and dashboard validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify embedded dashboard is synchronized
        run: python3 tools/build_dashboard.py --check

      - name: Verify package and dashboard JavaScript
        run: python3 tools/verify_package.py

  arduino-firmware-build:
    name: Compile ESP32-S3 sender and classic ESP32 receiver
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Espressif ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7

      - name: Install firmware libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install RF24
          arduino-cli lib install TinyGPSPlus
          arduino-cli lib install "Adafruit AHTX0"
          arduino-cli lib install Adafruit_BMP280_Library
          arduino-cli lib install Adafruit_GFX_Library
          arduino-cli lib install Adafruit_SSD1306
          arduino-cli lib install Adafruit_NeoPixel

      - name: Compile ESP32-S3 sender
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3 --warnings all firmware/RA_MAYDAY_Sender

      - name: Compile classic ESP32 receiver
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all firmware/RA_MAYDAY_Offline
